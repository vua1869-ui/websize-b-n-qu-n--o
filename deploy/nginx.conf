# ==============================================================================
# Nginx Configuration - AURA STUDIO Production Template
# ==============================================================================
# Đặc điểm:
# - Cấu hình HTTPS an toàn (TLS 1.2, TLS 1.3, HSTS)
# - Giới hạn Request Body tối đa 5MB (client_max_body_size 5M;)
# - Thiết lập proxy timeouts (connect, send, read: 60s)
# - Chuyển tiếp Request-ID, Real-IP và nén Gzip
# ==============================================================================

upstream aura_fastapi {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Chuyển hướng HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aurastudio.vn www.aurastudio.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Cấu hình HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aurastudio.vn www.aurastudio.vn;

    # SSL Certificates (Thay bằng đường dẫn chứng chỉ Let's Encrypt / Cloudflare)
    ssl_certificate /etc/letsencrypt/live/aurastudio.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurastudio.vn/privkey.pem;

    # Giao thức & Cipher bảo mật
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;

    # 1. Giới hạn dung lượng tải lên tối đa 5MB
    client_max_body_size 5M;
    client_body_buffer_size 128k;

    # 2. Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 60s;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Nén Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Tự động gán hoặc giữ lại X-Request-ID
    set $req_id $http_x_request_id;
    if ($req_id = "") {
        set $req_id $request_id;
    }

    # Phục vụ file tĩnh
    location /static/ {
        alias /app/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Health check endpoint
    location /healthz {
        proxy_pass http://aura_fastapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        access_log off;
    }

    # Reverse proxy toàn bộ traffic về FastAPI
    location / {
        proxy_pass http://aura_fastapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
