<!DOCTYPE html>
<html lang="vi" class="h-full bg-[#FAF8F5]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lại mật khẩu • {{ app_name }}</title>
  {%- include "components/fonts.html" -%}
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <link rel="stylesheet" href="/static/css/custom.css?v={{ version }}" />
</head>
<body class="flex min-h-full flex-col justify-center py-16 sm:px-6 lg:px-8 font-sans antialiased bg-[#FAF8F5] text-[#111111]">

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <!-- Quay lại trang đăng nhập -->
    <div class="mb-8 text-center">
      <a href="/login" class="inline-flex items-center gap-2 text-sm uppercase tracking-widest text-[#777777] transition hover:text-black font-medium">
        <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
        <span>Đăng nhập</span>
      </a>
    </div>

    <!-- Logo & Brand Header -->
    <div class="text-center">
      <a href="/" class="inline-flex flex-col items-center group">
        <span class="sr-only">AURA Studio</span>
        <span class="font-sans text-3xl sm:text-4xl font-bold tracking-tight text-[#111111]">AURA</span>
        <span class="mt-1 text-sm font-semibold uppercase tracking-[0.35em] text-[#777777]">Studio</span>
      </a>
      <h1 class="mt-6 font-sans text-2xl font-normal tracking-tight text-[#111111]">Đặt lại mật khẩu</h1>
      <p class="mt-1.5 text-sm text-[#666666]">
        Nhập mật khẩu mới để tiếp tục truy cập tài khoản AURA Studio của bạn
      </p>
    </div>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div class="bg-white border border-[#E5E2DC] rounded-[2px] p-6 sm:p-10 shadow-none">
      
      <!-- Thông báo lỗi / trạng thái -->
      <div id="reset-alert" class="hidden mb-6 rounded-[2px] p-3 text-sm font-medium border"></div>

      <form id="reset-form" class="space-y-5" autocomplete="off">
        <input type="hidden" id="token-input" value="{{ token }}" />

        <div>
          <label for="new_password" class="block text-sm uppercase tracking-wider font-semibold text-[#111111]">Mật khẩu mới</label>
          <div class="mt-2 relative">
            <input id="new_password" name="new_password" type="password" required minlength="6" placeholder="Tối thiểu 6 ký tự"
                   class="w-full rounded-[2px] border border-[#E5E2DC] bg-white px-3.5 py-2.5 text-sm text-[#111111] outline-none transition focus:border-[#111111] placeholder:text-[#999999]" />
          </div>
        </div>

        <div>
          <label for="confirm_password" class="block text-sm uppercase tracking-wider font-semibold text-[#111111]">Xác nhận mật khẩu mới</label>
          <div class="mt-2 relative">
            <input id="confirm_password" name="confirm_password" type="password" required minlength="6" placeholder="Nhập lại mật khẩu mới"
                   class="w-full rounded-[2px] border border-[#E5E2DC] bg-white px-3.5 py-2.5 text-sm text-[#111111] outline-none transition focus:border-[#111111] placeholder:text-[#999999]" />
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary w-full !py-3 text-sm uppercase tracking-widest font-semibold">
          <span id="submit-text">Cập nhật mật khẩu</span>
          <svg id="submit-spinner" class="hidden h-4 w-4 shrink-0 animate-spin text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("reset-form");
    const alertBox = document.getElementById("reset-alert");
    const submitBtn = document.getElementById("submit-btn");
    const submitText = document.getElementById("submit-text");
    const submitSpinner = document.getElementById("submit-spinner");
    const tokenInput = document.getElementById("token-input");

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.className = `mb-6 rounded-[2px] p-3 text-sm font-medium border ${
        isSuccess 
          ? "bg-[#FAF8F5] text-[#111111] border-[#111111]" 
          : "bg-red-50 text-red-700 border-red-200"
      }`;
      alertBox.classList.remove("hidden");
    }

    // Checking token presence on load
    const urlParams = new URLSearchParams(window.location.search);
    const urlToken = urlParams.get("token") || tokenInput.value;
    if (!urlToken) {
      showAlert("Đường dẫn đặt lại mật khẩu không hợp lệ hoặc thiếu mã xác minh (token).");
      submitBtn.disabled = true;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("hidden");

      const newPassword = document.getElementById("new_password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      const token = urlToken || tokenInput.value;

      if (!token) {
        showAlert("Thiếu mã xác nhận (token). Vui lòng kiểm tra lại liên kết trong email.");
        return;
      }

      if (newPassword.length < 6) {
        showAlert("Mật khẩu mới phải có tối thiểu 6 ký tự");
        return;
      }

      if (newPassword !== confirmPassword) {
        showAlert("Mật khẩu xác nhận không khớp với mật khẩu mới");
        return;
      }

      submitBtn.disabled = true;
      submitText.textContent = "Đang xử lý...";
      submitSpinner.classList.remove("hidden");

      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: newPassword, confirm_password: confirmPassword })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.detail || "Đặt lại mật khẩu thất bại");
          submitBtn.disabled = false;
          submitText.textContent = "Cập nhật mật khẩu";
          submitSpinner.classList.add("hidden");
          return;
        }

        showAlert(data.message || "Đặt lại mật khẩu thành công! Đang chuyển đến trang đăng nhập...", true);
        setTimeout(() => {
          window.location.href = "/login";
        }, 1500);

      } catch (err) {
        showAlert("Lỗi kết nối máy chủ. Vui lòng thử lại sau!");
        submitBtn.disabled = false;
        submitText.textContent = "Cập nhật mật khẩu";
        submitSpinner.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
