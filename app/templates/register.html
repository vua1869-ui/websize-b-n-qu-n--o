<!DOCTYPE html>
<html lang="vi" class="h-full bg-[#FBFBFA]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký thành viên • AURA Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <link rel="stylesheet" href="/static/css/custom.css?v={{ version }}" />
</head>
<body class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8 bg-[#FBFBFA] text-stone-900 font-sans antialiased selection:bg-brand-600 selection:text-white">
  
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <!-- Quay lại trang chủ -->
    <div class="mb-8 text-center">
      <a href="/" class="inline-flex items-center gap-2 text-xs uppercase tracking-widest text-stone-400 transition hover:text-stone-900 font-medium">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
        <span>Trang chủ</span>
      </a>
    </div>

    <!-- Logo & Brand Header -->
    <div class="text-center">
      <a href="/" class="inline-flex flex-col items-center group">
        <span class="font-serif text-3xl sm:text-4xl font-bold tracking-tight text-stone-900">AURA</span>
        <span class="mt-1 text-[10px] font-semibold uppercase tracking-[0.35em] text-brand-600">Studio</span>
      </a>
      <h1 class="mt-6 text-xl sm:text-2xl font-bold tracking-tight text-stone-900">Tạo tài khoản mới</h1>
      <p class="mt-1.5 text-xs text-stone-500">
        Tham gia để nhận đặc quyền thành viên và quản lý lịch sử đơn hàng
      </p>
    </div>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-lg px-4 sm:px-0">
    <div class="rounded-lg border border-stone-200 bg-white p-6 sm:p-10 shadow-xs">
      
      <!-- Thông báo lỗi / trạng thái -->
      <div id="register-alert" class="hidden mb-6 rounded-md p-3 text-xs font-medium border"></div>

      <form id="register-form" class="space-y-4" autocomplete="off">
        <div>
          <label for="full_name" class="block text-xs uppercase tracking-wider font-semibold text-stone-600">Họ và tên <span class="text-brand-600">*</span></label>
          <div class="mt-1.5">
            <input id="full_name" name="full_name" type="text" required placeholder="Nguyễn Văn A"
                   class="w-full rounded-md border border-stone-200 bg-[#FAF9F6] px-3.5 py-2.5 text-xs text-stone-900 outline-none transition focus:border-stone-900 focus:bg-white focus:ring-1 focus:ring-stone-900 placeholder:text-stone-400" />
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label for="username" class="block text-xs uppercase tracking-wider font-semibold text-stone-600">Tên đăng nhập <span class="text-brand-600">*</span></label>
            <div class="mt-1.5">
              <input id="username" name="username" type="text" required placeholder="nguyenvana"
                     class="w-full rounded-md border border-stone-200 bg-[#FAF9F6] px-3.5 py-2.5 text-xs text-stone-900 outline-none transition focus:border-stone-900 focus:bg-white focus:ring-1 focus:ring-stone-900 placeholder:text-stone-400" />
            </div>
          </div>

          <div>
            <label for="phone" class="block text-xs uppercase tracking-wider font-semibold text-stone-600">Số điện thoại</label>
            <div class="mt-1.5">
              <input id="phone" name="phone" type="tel" placeholder="0912345678"
                     class="w-full rounded-md border border-stone-200 bg-[#FAF9F6] px-3.5 py-2.5 text-xs text-stone-900 outline-none transition focus:border-stone-900 focus:bg-white focus:ring-1 focus:ring-stone-900 placeholder:text-stone-400" />
            </div>
          </div>
        </div>

        <div>
          <label for="email" class="block text-xs uppercase tracking-wider font-semibold text-stone-600">Địa chỉ Email <span class="text-brand-600">*</span></label>
          <div class="mt-1.5">
            <input id="email" name="email" type="email" required placeholder="name@example.com"
                   class="w-full rounded-md border border-stone-200 bg-[#FAF9F6] px-3.5 py-2.5 text-xs text-stone-900 outline-none transition focus:border-stone-900 focus:bg-white focus:ring-1 focus:ring-stone-900 placeholder:text-stone-400" />
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label for="password" class="block text-xs uppercase tracking-wider font-semibold text-stone-600">Mật khẩu <span class="text-brand-600">*</span></label>
            <div class="mt-1.5">
              <input id="password" name="password" type="password" required minlength="6" placeholder="Tối thiểu 6 ký tự"
                     class="w-full rounded-md border border-stone-200 bg-[#FAF9F6] px-3.5 py-2.5 text-xs text-stone-900 outline-none transition focus:border-stone-900 focus:bg-white focus:ring-1 focus:ring-stone-900 placeholder:text-stone-400" />
            </div>
          </div>

          <div>
            <label for="confirm_password" class="block text-xs uppercase tracking-wider font-semibold text-stone-600">Xác nhận mật khẩu <span class="text-brand-600">*</span></label>
            <div class="mt-1.5">
              <input id="confirm_password" name="confirm_password" type="password" required minlength="6" placeholder="Nhập lại mật khẩu"
                     class="w-full rounded-md border border-stone-200 bg-[#FAF9F6] px-3.5 py-2.5 text-xs text-stone-900 outline-none transition focus:border-stone-900 focus:bg-white focus:ring-1 focus:ring-stone-900 placeholder:text-stone-400" />
            </div>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" id="submit-btn" class="flex w-full items-center justify-center gap-2 rounded-md bg-brand-600 py-3 text-xs uppercase tracking-widest font-semibold text-white shadow-xs transition hover:bg-brand-700 active:scale-[0.99]">
            <span id="submit-text">Đăng ký tài khoản</span>
            <svg id="submit-spinner" class="hidden h-4 w-4 animate-spin text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          </button>
        </div>
      </form>

      <div class="mt-8 border-t border-stone-100 pt-6 text-center text-xs text-stone-500">
        <span>Đã có tài khoản thành viên?</span>
        <a href="/login" class="ml-1 font-semibold text-stone-900 hover:text-brand-600 transition">Đăng nhập &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("register-form");
    const alertBox = document.getElementById("register-alert");
    const submitBtn = document.getElementById("submit-btn");
    const submitText = document.getElementById("submit-text");
    const submitSpinner = document.getElementById("submit-spinner");

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.className = `mb-6 rounded-md p-3 text-xs font-medium border ${
        isSuccess 
          ? "bg-stone-50 text-stone-900 border-stone-200" 
          : "bg-rose-50 text-rose-700 border-rose-200"
      }`;
      alertBox.classList.remove("hidden");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("hidden");

      const fullName = document.getElementById("full_name").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;

      if (!fullName || !username || !email || !password) {
        showAlert("Vui lòng điền đầy đủ các trường bắt buộc (*)");
        return;
      }

      if (password !== confirmPassword) {
        showAlert("Mật khẩu xác nhận không khớp!");
        return;
      }

      if (password.length < 6) {
        showAlert("Mật khẩu phải có độ dài tối thiểu 6 ký tự!");
        return;
      }

      submitBtn.disabled = true;
      submitText.textContent = "Đang xử lý đăng ký...";
      submitSpinner.classList.remove("hidden");

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            full_name: fullName,
            username: username,
            email: email,
            phone: phone || null,
            password: password
          })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.detail || "Đăng ký không thành công!");
          submitBtn.disabled = false;
          submitText.textContent = "Đăng ký tài khoản";
          submitSpinner.classList.add("hidden");
          return;
        }

        localStorage.setItem("aura_token", data.token);
        localStorage.setItem("aura_user", JSON.stringify(data.user));

        showAlert("Chúc mừng! Đăng ký tài khoản thành công. Đang chuyển hướng...", true);
        setTimeout(() => {
          window.location.href = "/profile";
        }, 800);

      } catch (err) {
        showAlert("Lỗi kết nối máy chủ. Vui lòng kiểm tra lại mạng!");
        submitBtn.disabled = false;
        submitText.textContent = "Đăng ký tài khoản";
        submitSpinner.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
