<!DOCTYPE html>
<html lang="vi" class="h-full bg-[#FBFBFA]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập • AURA Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <link rel="stylesheet" href="/static/css/custom.css?v={{ version }}" />
</head>
<body class="flex min-h-full flex-col justify-center py-16 sm:px-6 lg:px-8 bg-[#FBFBFA] text-stone-900 font-sans antialiased selection:bg-brand-600 selection:text-white">
  
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <!-- Quay lại trang chủ -->
    <div class="mb-8 text-center">
      <a href="/" class="inline-flex items-center gap-2 text-xs uppercase tracking-widest text-stone-400 transition hover:text-stone-900 font-medium">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
        <span>Trang chủ</span>
      </a>
    </div>

    <!-- Logo & Brand Header -->
    <div class="text-center">
      <a href="/" class="inline-flex flex-col items-center group">
        <span class="sr-only">AURA Studio</span>
        <span class="font-serif text-3xl sm:text-4xl font-bold tracking-tight text-stone-900">AURA</span>
        <span class="mt-1 text-[10px] font-semibold uppercase tracking-[0.35em] text-brand-600">Studio</span>
      </a>
      <h1 class="mt-6 text-xl sm:text-2xl font-bold tracking-tight text-stone-900">Đăng nhập tài khoản</h1>
      <p class="mt-1.5 text-xs text-stone-500">
        Trải nghiệm không gian thời trang tuyển chọn và dịch vụ cá nhân hoá
      </p>
    </div>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div class="rounded-lg border border-stone-200 bg-white p-6 sm:p-10 shadow-xs">
      
      <!-- Thông báo lỗi / trạng thái -->
      <div id="login-alert" class="hidden mb-6 rounded-md p-3 text-xs font-medium border"></div>

      <form id="login-form" class="space-y-5" autocomplete="on">
        <div>
          <label for="username" class="block text-xs uppercase tracking-wider font-semibold text-stone-600">Tên đăng nhập hoặc Email</label>
          <div class="mt-2">
            <input id="username" name="username" type="text" required placeholder="Tên đăng nhập hoặc địa chỉ email"
                   class="w-full rounded-md border border-stone-200 bg-[#FAF9F6] px-3.5 py-2.5 text-xs text-stone-900 outline-none transition focus:border-stone-900 focus:bg-white focus:ring-1 focus:ring-stone-900 placeholder:text-stone-400" />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="block text-xs uppercase tracking-wider font-semibold text-stone-600">Mật khẩu</label>
            <a href="javascript:void(0)" onclick="alert('Vui lòng liên hệ quản trị viên hoặc sử dụng tài khoản của bạn.')" class="text-xs text-stone-400 hover:text-stone-700 transition">Quên mật khẩu?</a>
          </div>
          <div class="mt-2 relative">
            <input id="password" name="password" type="password" required placeholder="••••••••"
                   class="w-full rounded-md border border-stone-200 bg-[#FAF9F6] px-3.5 py-2.5 text-xs text-stone-900 outline-none transition focus:border-stone-900 focus:bg-white focus:ring-1 focus:ring-stone-900 placeholder:text-stone-400 pr-10" />
            <button type="button" id="toggle-pw-btn" class="absolute inset-y-0 right-0 flex items-center pr-3 text-stone-400 hover:text-stone-600" aria-label="Hiện mật khẩu">
              <svg id="eye-icon" class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-0.5">
          <label class="flex items-center cursor-pointer select-none">
            <input id="remember-me" name="remember-me" type="checkbox" checked
                   class="h-4 w-4 rounded border-stone-300 text-stone-900 focus:ring-0 focus:ring-offset-0" />
            <span class="ml-2 text-xs text-stone-500">Ghi nhớ đăng nhập</span>
          </label>
        </div>

        <button type="submit" id="submit-btn" class="flex w-full items-center justify-center gap-2 rounded-md bg-brand-600 py-3 text-xs uppercase tracking-widest font-semibold text-white shadow-xs transition hover:bg-brand-700 active:scale-[0.99]">
          <span id="submit-text">Đăng nhập</span>
          <svg id="submit-spinner" class="hidden h-4 w-4 animate-spin text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </button>
      </form>

      <div class="mt-8 border-t border-stone-100 pt-6 text-center text-xs text-stone-500">
        <span>Chưa có tài khoản thành viên?</span>
        <a href="/register" class="ml-1 font-semibold text-stone-900 hover:text-brand-600 transition">Đăng ký ngay &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    // Password toggle
    const togglePwBtn = document.getElementById("toggle-pw-btn");
    const pwInput = document.getElementById("password");
    if (togglePwBtn && pwInput) {
      togglePwBtn.addEventListener("click", () => {
        const isPw = pwInput.type === "password";
        pwInput.type = isPw ? "text" : "password";
        togglePwBtn.innerHTML = isPw 
          ? `<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>`
          : `<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`;
      });
    }

    // Submit handler
    const form = document.getElementById("login-form");
    const alertBox = document.getElementById("login-alert");
    const submitBtn = document.getElementById("submit-btn");
    const submitText = document.getElementById("submit-text");
    const submitSpinner = document.getElementById("submit-spinner");

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.className = `mb-6 rounded-md p-3 text-xs font-medium border ${
        isSuccess 
          ? "bg-stone-50 text-stone-900 border-stone-200" 
          : "bg-rose-50 text-rose-700 border-rose-200"
      }`;
      alertBox.classList.remove("hidden");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("hidden");

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showAlert("Vui lòng điền đầy đủ tên đăng nhập và mật khẩu");
        return;
      }

      submitBtn.disabled = true;
      submitText.textContent = "Đang xác thực...";
      submitSpinner.classList.remove("hidden");

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.detail || "Đăng nhập thất bại");
          submitBtn.disabled = false;
          submitText.textContent = "Đăng nhập";
          submitSpinner.classList.add("hidden");
          return;
        }

        localStorage.setItem("aura_token", data.token);
        localStorage.setItem("aura_user", JSON.stringify(data.user));

        showAlert("Đăng nhập thành công! Đang chuyển hướng...", true);

        const params = new URLSearchParams(window.location.search);
        let redirectUrl = params.get("redirect");
        if (!redirectUrl) {
          redirectUrl = data.user.role === "admin" ? "/admin" : "/profile";
        }

        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 600);

      } catch (err) {
        showAlert("Lỗi kết nối máy chủ. Vui lòng kiểm tra lại mạng!");
        submitBtn.disabled = false;
        submitText.textContent = "Đăng nhập";
        submitSpinner.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
